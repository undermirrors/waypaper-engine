<div class="installed-page">
  <div class="main-header">
    <app-search-bar
      [value]="search"
      placeholder="Rechercher un fond d'écran..."
      (searchChange)="onSearchChange($event)">
    </app-search-bar>
    <div class="header-info">
      <span class="wallpaper-count">{{ wallpapers.length }} fond(s) d'écran</span>
    </div>
  </div>

  <div class="wallpaper-grid">
    <app-wallpaper-card
      *ngFor="let wp of wallpapers; trackBy: trackByWallpaperId"
      [wallpaper]="wp"
      (wallpaperClick)="onWallpaperClick($event)">
    </app-wallpaper-card>
  </div>
</div>
