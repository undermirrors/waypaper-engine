<div class="app-container">
    <nav class="sidebar">
        <div class="sidebar-header">
            <div class="app-logo">
                <img src="assets/logo.png" alt="Waypaper Logo" class="logo-image">
                <span>Waypaper</span>
            </div>
        </div>

        <div class="nav-section">
            <h3 class="section-title">Navigation</h3>
            <ul class="nav-menu">
                <li class="nav-item" routerLink="/installed" routerLinkActive="selected">
                    <i class="fa-solid fa-download"></i>
                    <span>Installé</span>
                </li>
                <li class="nav-item" routerLink="/themes" routerLinkActive="selected">
                    <i class="fa-solid fa-compass"></i>
                    <span>Découvrir</span>
                </li>
                <li class="nav-item">
                    <i class="fa-solid fa-heart"></i>
                    <span>Favoris</span>
                </li>
                <li class="nav-item" routerLink="/settings" routerLinkActive="selected">
                    <i class="fa-solid fa-gear"></i>
                    <span>Paramètres</span>
                </li>
            </ul>
        </div>

        <div class="nav-section">
            <h3 class="section-title">Affichage</h3>
            <div class="control-group">
                <app-screen-selector
                    [screens]="screens"
                    [selectedScreen]="selectedScreen"
                    (screenChange)="onScreenChange($event)">
                </app-screen-selector>
            </div>
        </div>


        <div class="sidebar-footer">
        </div>
    </nav>

    <main class="main-content">
        <router-outlet></router-outlet>
    </main>
</div>
