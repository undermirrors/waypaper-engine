<div class="app-container">
    <nav class="sidebar">
        <div class="sidebar-header">
            <div class="app-logo">
                <i class="fa-solid fa-image"></i>
                <span>Waypaper</span>
            </div>
        </div>

        <div class="nav-section">
            <h3 class="section-title">Navigation</h3>
            <ul class="nav-menu">
                <li class="nav-item selected">
                    <i class="fa-solid fa-download"></i>
                    <span>Installé</span>
                </li>
                <li class="nav-item">
                    <i class="fa-solid fa-compass"></i>
                    <span>Découvrir</span>
                </li>
                <li class="nav-item">
                    <i class="fa-solid fa-heart"></i>
                    <span>Favoris</span>
                </li>
            </ul>
        </div>

        <div class="nav-section">
            <h3 class="section-title">Affichage</h3>
            <div class="control-group">
                <label class="control-label">
                    <i class="fa-solid fa-display"></i>
                    Écran
                </label>
                <select class="modern-select" [(ngModel)]="selectedScreen" (change)="onScreenChange()">
                    <option *ngFor="let screen of screens" [value]="screen">{{ screen }}</option>
                </select>
            </div>
        </div>

        <div class="nav-section theme-section">
            <h3 class="section-title">Thème</h3>
            <div class="theme-grid">
                <div
                    class="theme-card"
                    *ngFor="let t of themes"
                    [class.active]="currentTheme?.id === t.id"
                    (click)="selectTheme(t)"
                    [title]="t.name">
                    <div class="theme-preview" [style.background]="t.preview"></div>
                    <span>{{ t.name }}</span>
                </div>
            </div>
        </div>

        <div class="sidebar-footer">
            <button class="footer-btn" title="Paramètres">
                <i class="fa-solid fa-gear"></i>
            </button>
            <button class="footer-btn danger" (click)="stopDaemon()" title="Arrêter le daemon">
                <i class="fa-solid fa-power-off"></i>
            </button>
        </div>
    </nav>

    <main class="main-content">
        <div class="main-header">
            <div class="search-container">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input
                    class="search-input"
                    type="text"
                    placeholder="Rechercher un fond d'écran..."
                    [(ngModel)]="search"
                    (input)="onSearchChange()" />
            </div>
            <div class="header-info">
                <span class="wallpaper-count">{{ wallpapers.length }} fond(s) d'écran</span>
            </div>
        </div>

        <div class="wallpaper-grid">
            <div
                class="wallpaper-card"
                *ngFor="let wp of wallpapers"
                [id]="wp.id"
                (click)="onWallpaperClick(wp.id)">
                <div class="wallpaper-preview" [style.backgroundImage]="'url(' + wp.preview_b64 + ')'">
                    <div class="wallpaper-overlay">
                        <i class="fa-solid fa-play"></i>
                    </div>
                </div>
                <div class="wallpaper-info">
                    <h3 class="wallpaper-title">{{ wp.title }}</h3>
                </div>
            </div>
        </div>
    </main>
</div>
